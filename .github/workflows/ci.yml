name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Type check and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  end-to-end:
    name: End-to-end tests (need internet)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # These tests call live public services (RDAP, Wikidata, npm, PyPI), so one retry
      # avoids failing the build on a single slow or rate-limited answer.
      - run: npm run test:e2e || (sleep 20 && npm run test:e2e)
